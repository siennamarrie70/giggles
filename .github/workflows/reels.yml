# Instagram Reels in the cloud. Instagram's API can't schedule a Reel, so this posts each story's short version (the
# whole story in under a minute) as a Reel once its time has come (it goes public on YouTube as a Short
# series.short_after_hours after the story: 17:30 + 3 h = 20:30 India time, 15:00 UTC). It was kept, encrypted, by the
# morning run that made it (tools/kept.py), and Instagram fetches it from a temporary link (tools/instagram.py). It stays
# up to 40 minutes for retries and for YouTube being a little late making the Short public; with nothing due it ends in
# a minute or two.
# The two lines run at :35 of the even hours and :05 of the odd ones, 02:35 to 21:05 UTC: a Reel is posted by the first
# run after its time (20:30 India time = 15:00 UTC: the 15:05 run), and a run GitHub starts late or skips is covered by
# the next.
# "Run workflow" on the Actions tab starts it by hand. The PAUSED variable, or the dashboard's pause switch, stops it.
name: Reels

on:
  schedule:
    - cron: "35 2-20/2 * * *"  # :35 of every other hour, 08:05 ... 02:05 India time
    - cron: "5 3-21/2 * * *"   # :05 of the hours between (GitHub can start late, or skip)
  workflow_dispatch:

concurrency:
  group: reels
  cancel-in-progress: false  # never two at once (a Reel goes up once)

permissions:
  contents: read
  actions: read  # to download the short versions the morning runs kept

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # (no GitHub key left on the machine)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install (requirements-worker.txt, as the morning run)
        run: pip install -r requirements-worker.txt

      - name: Post the Reels whose time has come
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}  # (a Reel goes up only once its Short is public there)
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REELS_KEY: ${{ secrets.REELS_KEY }}  # decrypts the kept short versions
          GH_TOKEN: ${{ github.token }}  # downloads them (gh run download)
          PAUSED: ${{ vars.PAUSED }}
        run: python tools/jobs.py instagram --stay 40
