# Instagram Reels in the cloud. Instagram's API can't schedule a Reel, so 5 minutes after each posting slot
# (and again 30 minutes later, in case GitHub starts the first one late or skips it) this posts the Reels whose
# slot has come: their videos were kept, encrypted, by the morning run that made them (tools/kept.py), and
# Instagram fetches each from a temporary link (tools/instagram.py). It stays up to 40 minutes for retries and
# for YouTube being a little late making a Short public; with nothing due it ends in a minute or two. A Reel whose
# slot comes while its morning run is still going is posted by that run.
# The times are UTC: the slots are every 2 hours from 08:00 India time (02:30 UTC; config/channel.yaml
# schedule). If the posting times change, change them here too (the test suite checks that they match).
# "Run workflow" on the Actions tab starts it by hand. The PAUSED variable, or the dashboard's pause switch,
# stops it.
name: Reels

on:
  schedule:
    - cron: "35 2-20/2 * * *"  # 5 minutes after each slot: 08:05, 10:05 ... 02:05 India time
    - cron: "5 3-21/2 * * *"   # 35 minutes after: one the first missed (GitHub can start late, or skip)
  workflow_dispatch:

concurrency:
  group: reels
  cancel-in-progress: false  # never two at once (a Reel goes up once)

permissions:
  contents: read
  actions: read  # to download the videos the morning runs kept

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # (no GitHub key left on the machine)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install (requirements-worker.txt, as the morning run)
        run: pip install -r requirements-worker.txt

      - name: Post the Reels whose slot has come
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}  # (a Reel goes up only once its Short is public there)
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REELS_KEY: ${{ secrets.REELS_KEY }}  # decrypts the kept videos
          GH_TOKEN: ${{ github.token }}  # downloads them (gh run download)
          PAUSED: ${{ vars.PAUSED }}
        run: python tools/jobs.py instagram --stay 40
