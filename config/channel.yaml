# Channel settings read by the agents. Edit here or in the dashboard's Settings page.

channel:
  name: "Paws & Giggles"   # kept for now; rename it in Settings when you choose the cartoon channel's name
  audience: "adults worldwide who enjoy short, relatable comedy sketches"
  voice: >-
    Dry, warm and quick. Everyday adult life: work, bills, flatmates, dating, the gym, Mondays, family
    group chats. The punchline lands on the last line. Clean enough for any advertiser: no slurs, nothing
    sexual, no politics, no tragedy, no real people or brands. Never aimed at children.
  contact_email: ""          # shown on the public /about and /privacy pages; optional

schedule:
  # The autopilot posts posts_per_day Shorts: the first at first_post, then one every every_hours, on this
  # time zone's clock (08:00, 14:00 and 20:00 here). Each Short is made in the hours before its slot and
  # YouTube publishes it on the minute. `python tools/slots.py` lists them.
  timezone: "Asia/Kolkata"
  first_post: "08:00"
  every_hours: 6
  posts_per_day: 3

episodes:
  # Agent 1 picks one of these settings for each episode and casts 2 to max_cast characters;
  # Agent 2 keeps each sketch under max_seconds. The dashboard on this computer keeps `queue`
  # episodes written ahead and renders their previews, so you can watch them before they go up.
  settings: ["office", "flat", "kitchen", "cafe", "gym", "street", "park"]
  max_cast: 3
  max_seconds: 60
  queue: 2

trends:
  region: "ALL"              # ALL = every country, the most widespread trends first; or one code like US
  calendar_days_ahead: 3     # theme around holidays and world days this many days early

metadata:
  category_id: '23'          # Comedy
  base_hashtags: ["#shorts", "#animation", "#comedy"]
  language: en

music:
  volume: 1.0                # the music under the voices (0 = none); it dips while someone speaks
